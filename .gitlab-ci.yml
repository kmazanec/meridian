# Meridian CI — Phase 1: Rust on-chain program.
#
# Scope (deliberately): build the program, then format, lint, and test the
# Anchor/Rust program plus a prettier check on the TypeScript. A devnet deploy
# stage comes later (see docs/ROADMAP.md, F-10).
#
# Why a build stage: the LiteSVM tests `include_bytes!(target/deploy/meridian.so)`
# — they load the *compiled BPF program*. That .so is gitignored and only exists
# locally after a build, so a clean CI checkout has nothing to include, and both
# `clippy --all-targets` (compiles the test targets) and `cargo test` fail without
# it. The `build-program` job produces meridian.so once (cargo build-sbf in the
# official Anchor image, which matches our anchor-cli 1.0.2) and passes it forward
# as an artifact; clippy and test consume it. fmt and lint-ts need no .so and stay
# on lean rust:1.89 / node:20 images.
#
# EXECUTOR NOTE: the `gauntlet-droplet` runner is a *shell* executor, so the
# GitLab `image:` keyword is ignored — jobs run directly on the host shell, which
# has no Rust/Node toolchain. We therefore run each job's real work inside a
# container with `docker run`, via the `dind`-free `run_in_docker` shell function
# defined in `before_script`. (A function in a real shell context evaluates
# `$(id -u)` correctly; embedding `$()` in a GitLab `variables:` value does not —
# GitLab interpolates the value as text and the nested quoting gets mangled.)
# The host only needs Docker (+ git for checkout). `run_in_docker <image> <cmd>`:
#   -v "$CI_PROJECT_DIR":/build -w /build   mount the checked-out repo
#   -u <uid>:<gid>                          write artifacts as the runner user so
#                                           GitLab cache/cleanup can manage
#                                           target/ and node_modules/
#   -e CARGO_HOME=/build/.cargo             keep the cargo cache inside the
#                                           project dir so `cache:` can archive it

stages:
  - build
  - check
  - review

# Automated code + security review on merge requests, via the shared
# gitlab-cursor-review template (Cursor CLI). It runs on the dedicated
# `cursor-review` runner — the job's own tags/image/before_script override our
# `default:` block, so it does NOT use the gauntlet-droplet docker-wrapper above.
# Requires repo CI/CD variables CURSOR_API_KEY and GITLAB_REVIEW_BOT_TOKEN
# (masked, Protected off for unprotected feature branches). Manual by default;
# set CURSOR_REVIEW_MANUAL=false to auto-run on every MR pipeline.
include:
  - project: 'keithmazanec/gitlab-cursor-review'
    ref: main
    file: '/templates/cursor-review.yml'

default:
  # Pin every job to the project's dedicated runner. A job that sets its own
  # `tags:` overrides this, so don't add per-job tags unless you mean to.
  tags:
    - gauntlet-droplet
  # Define `run_in_docker` once; inherited by every job's shell session.
  before_script:
    - |
      # For lean images (rust:1.89, node:20): run as the runner user so build
      # outputs stay runner-owned. CARGO_HOME inside the project dir keeps the
      # cargo cache archivable. NB `bash -c`, NOT `bash -lc`: a login shell
      # sources /etc/profile and resets PATH, dropping the image's ENV PATH
      # (/usr/local/cargo/bin) — which yields `cargo: command not found` for a
      # non-root UID. A non-login shell preserves the image's ENV PATH.
      run_in_docker() {
        image="$1"; shift
        docker run --rm \
          -v "$CI_PROJECT_DIR":/build -w /build \
          -u "$(id -u):$(id -g)" \
          -e HOME=/build/.home \
          -e CARGO_HOME=/build/.cargo \
          -e CARGO_TERM_COLOR=always \
          -e npm_config_cache=/build/.npm \
          "$image" bash -c "mkdir -p /build/.home && $*"
      }
      # For the Anchor image: its Rust/Solana toolchain is installed under /root
      # (cargo at /root/.cargo/bin) and the image runs as root, so a non-root `-u`
      # mapping can't traverse /root → `cargo: command not found`. Run as root
      # (default HOME=/root, so the toolchain resolves) BUT point CARGO_HOME at the
      # project-dir cache so crate downloads persist across runs (the image's
      # default /root/.cargo lives inside the --rm container and is discarded).
      # Then chown the cached dirs back to the runner UID/GID so GitLab can
      # archive them. Preserves the job's exit code.
      run_in_docker_root() {
        image="$1"; shift
        docker run --rm \
          -v "$CI_PROJECT_DIR":/build -w /build \
          -e CARGO_HOME=/build/.cargo \
          -e CARGO_TERM_COLOR=always \
          "$image" bash -c "$* ; rc=\$? ; chown -R $(id -u):$(id -g) target .cargo 2>/dev/null || true ; exit \$rc"
      }

variables:
  CARGO_TERM_COLOR: always

# Cache the Cargo registry and build output across runs so we don't recompile
# the whole workspace (and re-download every crate) every pipeline. One shared
# cache for the heavy Rust jobs (build-program + verify), keyed on Cargo.lock so
# a dependency change rotates it. The SBF build and the host-target build write
# different subdirs of target/ (sbf-solana-solana/ vs debug/), so they coexist.
# CARGO_HOME is /build/.cargo in-container (see run_in_docker*), so the registry
# lives here and is cached too.
cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

# Run on merge requests and on the default branch; skip duplicate "branch"
# pipelines when an MR is open for that branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

# Build the BPF program once. The official Anchor image (tag matches our
# anchor-cli 1.0.2) carries the Solana platform-tools, so `cargo build-sbf`
# produces target/deploy/meridian.so. Pass it forward so clippy/test can load it.
build-program:
  stage: build
  script:
    - run_in_docker_root solanafoundation/anchor:v1.0.2 'cargo build-sbf'
    - test -f target/deploy/meridian.so   # fail loudly if the artifact is missing
  artifacts:
    paths:
      - target/deploy/meridian.so
    expire_in: 1 day

fmt:
  stage: check
  needs: []   # formatting is independent of the program build
  script:
    - run_in_docker rust:1.89 'cargo fmt --all -- --check'

# clippy + test in ONE job so the host-target workspace compiles a single time
# (test reuses clippy's target/ instead of recompiling from scratch in a second
# job). Both need the build-program .so artifact (the tests include_bytes! it) and
# the Anchor image's toolchain. `&&` so a clippy failure short-circuits before the
# slower test run. This replaces the former separate clippy + test jobs, halving
# the host-target compiles per pipeline.
verify:
  stage: check
  needs: ["build-program"]
  script:
    - >-
      run_in_docker_root solanafoundation/anchor:v1.0.2
      'cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'

# TypeScript is linted with prettier (the only JS tooling the repo declares).
# We run prettier via `npx` rather than `yarn install`: it needs no global
# install (corepack/yarn shims would write to root-owned /usr/local/bin and fail
# under the non-root `-u` mapping), and prettier is the only thing `yarn lint`
# actually invokes. The version is pinned to match package.json (prettier ^2).
# Cache is the project-local npm cache so repeat runs skip the download.
#
# NOTE: when the off-chain workspace lands (F-06+) with a committed yarn.lock,
# switch this to a real `yarn install --frozen-lockfile && yarn lint`.
lint-ts:
  stage: check
  needs: []   # prettier is independent of the program build
  cache:
    key:
      files:
        - package.json
    paths:
      - .npm/
  script:
    - run_in_docker node:20 'npx --yes prettier@2 "*/**/*{.js,.ts}" --check'

# Cursor code + security review (see the `include:` near the top). Inherits the
# template's cursor-review runner tag, cursor-ci image, rules (manual on MRs),
# and before_script — none of our default docker-wrapper applies here.
cursor_code_review:
  extends: .cursor_review
  stage: review
  needs: []   # independent of build/check/test; runs only on MR pipelines
