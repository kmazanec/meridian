[package]
name = "meridian"
version = "0.1.0"
description = "Meridian — binary stock-outcome markets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
# Pin solana-zero-copy to 1.0.0: version 1.1.0 adds extra From/PartialOrd impls
# that make `PodU64::into()` ambiguous (E0283), breaking spl-token-2022-interface
# — which anchor-spl's `init` (mint::/token::) constraint codegen references via
# token_interface. Pinning 1.0.0 lets the full anchor-spl compile so we can use
# Anchor's idiomatic init constraints. (Meridian uses standard SPL Token USDC.)
solana-zero-copy = "=1.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-account = "3.0.0"
solana-sdk-ids = "3.0.0"
solana-loader-v3-interface = { version = "6", features = ["bincode"] }
solana-program-pack = "3.0.0"
solana-program-option = "3.0.0"
solana-clock = "3.1.0"
spl-token-interface = "2.0"
bincode = "1.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
